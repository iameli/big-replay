  <title id="title">Big Replay</title>
  <desc id="desc">A Big Walk gourd filled edge to edge with six alternating purple (#8053ac) and yellow (#d6bf35) spiral sections radiating from its center. A white inner outline and black outer outline separate the silhouette from light and dark backgrounds.</desc>
