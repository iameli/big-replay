name: Release Big Replay

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: big-replay-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/next'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build BigReplay.slnx -c Release

      - name: Publish Windows x64 desktop
        run: dotnet publish src/BigReplay.Desktop/BigReplay.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/BigReplay

      - name: Package executable and manifest
        run: |
          foreach ($file in @('BigReplay.exe', 'manifest.json')) {
            if (-not (Test-Path "dist/BigReplay/$file" -PathType Leaf)) {
              throw "Published release is missing $file"
            }
          }
          Compress-Archive -Path dist/BigReplay/* -DestinationPath dist/BigReplay-win-x64.zip -Force

      - name: Build per-user installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler "/DAppVersion=0.1.$env:GITHUB_RUN_NUMBER" installer/BigReplay.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/next" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the latest next commit' }
          if ($head -ne $env:GITHUB_SHA) {
            Write-Output 'A newer commit is on next; leaving the latest release unchanged.'
            exit 0
          }
          $tag = "next-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notes = @'
          Download and run **BigReplay-Setup.exe** for a per-user installation, a Start menu shortcut, and an optional **Start Big Replay when I sign in to Windows** setting. No administrator access or .NET installation is needed.

          Prefer a portable copy? Extract **BigReplay-win-x64.zip**, then run **BigReplay.exe**. Both downloads are for Windows x64.

          Run on the **Big Walk host machine**, as the same Windows user as the game. Keep the bundled **manifest.json** beside the executable; it must match the installed game build.

          Recordings are saved to **Documents/BigReplay** and are kept when uninstalling. Close Big Replay before updating or uninstalling so it can finish saving.

          Watch recordings in the [Big Replay viewer](https://iameli.github.io/big-replay/). Files chosen in the viewer are read locally in your browser, not uploaded.
          '@
          gh release create $tag dist/BigReplay-Setup.exe dist/BigReplay-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Big Replay' --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

  pages:
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out viewer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage viewer site
        run: |
          mkdir -p _site/web/viewer
          cp index.html bigmap.jpeg _site/
          cp web/viewer/index.html web/viewer/map-view.js web/viewer/sample.replay.json.gz _site/web/viewer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
